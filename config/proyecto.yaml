# Parámetros generales del proyecto NutriScan CO.
# Las rutas son relativas a la carpeta raíz del repositorio.

fuente:
  # Volcado CSV completo de Open Food Facts (~0,9 GB comprimido, ~9 GB descomprimido)
  csv_url: "https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz"
  # API pública para consultar un producto por código de barras
  api_url: "https://world.openfoodfacts.org/api/v2/product/{codigo}.json"
  # Código colombiano de prueba usado en el anteproyecto
  codigo_prueba: "7702011271662"

rutas:
  raw: "data/raw"
  bronze: "data/bronze"
  silver: "data/silver"
  gold: "data/gold"
  reportes: "reports"

paises:
  objetivo: "en:colombia"
  comparacion: ["en:chile", "en:mexico", "en:peru"]

spark:
  app_name: "NutriScanCO"
  # Memoria del "driver" (el proceso que corre en tu PC). El equipo tiene 23 GB.
  driver_memory: "12g"
  shuffle_partitions: 16

modelado:
  semilla: 42
  particion: { entrenamiento: 0.70, validacion: 0.15, prueba: 0.15 }
  meta_f1: 0.80
  # Máximo de productos para entrenar (muestra aleatoria del 70 %): el resto
  # de los datos se sigue usando completo para validar y probar.
  max_entrenamiento: 400000
  vocabulario: 5000        # palabras y pares de palabras más frecuentes
  min_documentos: 20       # una palabra debe aparecer en al menos 20 productos
  regresion_logistica: { iteraciones: 100, regularizacion: 0.001 }
  # La red neuronal de Spark convierte los datos a tablas densas (filas x variables):
  # con 5000 variables y 400 mil filas serían ~16 GB. Por eso usa solo las 1000
  # variables más informativas (prueba ANOVA) y 200 mil productos (~1,6 GB).
  red_neuronal: { capas_ocultas: [64], iteraciones: 100, tam_bloque: 128,
                  variables: 1000, max_entrenamiento: 200000 }
  ruido: { niveles: [0.1, 0.2, 0.3, 0.5], truncado: [0.5] }
  # Se calcula la silueta de k=2 a 10, pero se elige entre k >= 3: con k=2 solo
  # se separan productos "livianos" de "densos", lo cual no aporta información.
  kmeans: { k_min: 2, k_max: 10, k_min_eleccion: 3, max_productos: 500000 }
